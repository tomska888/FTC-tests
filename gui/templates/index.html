<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CUC Website Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <!-- Form -->
    <div class="form-panel">
          <!-- Header -->
      <div class="header">
        <h1>🔍 CUC Website Scanner</h1>
      </div>
      <form method="post">
        <input name="url" type="text" placeholder="https://example.com" value="{{ request.form.url or '' }}">
        <button type="submit">Scan</button>
        <div class="tests">
          {% for tid, cfg in tests.items() %}
            <label>
              <input
                type="checkbox"
                name="tests"
                value="{{ tid }}"
                {% if tid in chosen %}checked{% endif %}>
              {{ cfg.label }}
            </label>
          {% endfor %}
        </div>
      </form>
    </div>

    <!-- Results -->
    {% if results %}
      <div class="results-panel">
        {% for tid, section in results.items() %}
          <div class="section">
            <h2>{{ section.label }}</h2>
            <table>
              <tr><th>Field</th><th>Value</th></tr>
              {% for title, val in section.rows %}
                <tr>
                  <td>{{ title }}</td>
                  <td style="white-space: pre-wrap;">{{ val }}</td>
                </tr>
              {% endfor %}
            </table>
          </div>
        {% endfor %}
        <div class="timestamp">
          Scan run at {{ timestamp }}
        </div>
      </div>
    {% endif %}
  </div>
</body>
</html>
