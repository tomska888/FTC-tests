<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CUC Website Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- expose the Drive folder ID to JS -->
  <script>
    const DRIVE_FOLDER_ID = "{{ drive_folder_id }}";
  </script>
</head>
<body>
  <div class="container">
    <!-- Form -->
    <div class="form-panel">
      <div class="header">
        <h1>🔍 CUC Website Scanner</h1>
      </div>
      <form>
        <input name="url" type="text"
               placeholder="https://example.com"
               value="{{ request.form.url or '' }}">
        <button type="submit">Scan</button>
        <div class="tests">
          {% for tid, cfg in tests.items() %}
            <label>
              <input type="checkbox" name="tests" value="{{ tid }}"
                     {% if tid in chosen %}checked{% endif %}>
              {{ cfg.label }}
            </label>
          {% endfor %}
        </div>
      </form>
    </div>

    <!-- Progress bar -->
    <div id="progress-container" style="display:none; margin:1em 0;">
      <progress id="progress-bar" value="0" max="100" style="width:100%;"></progress>
      <div id="progress-text" style="text-align:right; font-size:0.9em; color:#555;">
        0%
      </div>
    </div>

    <!-- Results -->
    <div id="results-wrapper" class="results-panel"></div>
  </div>

  <script>
    const form      = document.querySelector('form');
    const bar       = document.getElementById('progress-bar');
    const pct       = document.getElementById('progress-text');
    const progWrap  = document.getElementById('progress-container');
    const resultsWr = document.getElementById('results-wrapper');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      resultsWr.innerHTML = '';
      bar.value = 0; pct.textContent = '0%';
      progWrap.style.display = 'block';

      const data  = new FormData(form);
      let tests   = data.getAll('tests');
      let url     = data.get('url').trim();
      if (!url) { alert('Please enter a URL'); return; }
      if (!url.startsWith('http')) url = 'http://' + url;

      const total = tests.length;
      const allResults = {};

      // run each test via AJAX
      for (let i = 0; i < total; i++) {
        const tid = tests[i];
        const body = new FormData();
        body.append('url', url);
        body.append('tid', tid);

        let js;
        try {
          const resp = await fetch('/run_test', { method:'POST', body });
          js = await resp.json();
          if (js.error) throw new Error(js.error);
        } catch(err) {
          js = { tid, label:tid, rows:[{title:'Error', val:err.message}] };
        }

        const section = document.createElement('div');
        section.classList.add('section');
        section.innerHTML = `
          <h2>${js.label}</h2>
          <table>
            <tr><th>Field</th><th>Value</th></tr>
            ${js.rows.map(r=>`
              <tr>
                <td>${r.title}</td>
                <td style="white-space: pre-wrap;">${r.val}</td>
              </tr>
            `).join('')}
          </table>`;
        resultsWr.appendChild(section);

        allResults[js.tid] = { label: js.label, rows: js.rows };

        const pctDone = Math.round(((i+1)/total)*100);
        bar.value = pctDone; pct.textContent = pctDone + '%';
      }

      // timestamp
      const ts = document.createElement('div');
      ts.classList.add('timestamp');
      ts.textContent = 'Scan run at {{ timestamp }}';
      resultsWr.appendChild(ts);

      // save and upload
      const resp2 = await fetch('/save_results', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url, results: allResults})
      });
      const js2 = await resp2.json();
      if (js2.status === 'ok') {
        const linkDiv = document.createElement('div');
        linkDiv.style.marginTop = '1em';
        linkDiv.innerHTML = `
          <a href="https://drive.google.com/drive/folders/1MsZqiAjItdSXmV70Ofq0x8oNRIloBqMr?usp=drive_link"
             target="_blank">
             📁 View all scans on Drive
          </a>`;
        resultsWr.appendChild(linkDiv);
      }
    });
  </script>
</body>
</html>
